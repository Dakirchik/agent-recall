# agent-recall config. Created by `brain init`; lives in ~/.agent-recall/config.toml
# (elsewhere: --config <path> or the BRAIN_CONFIG environment variable).
# Forward slashes work on Windows too; ~ and %VAR% are expanded.

# Interface language: "en" or "ru" (default: the OS language). Also: AGENT_RECALL_LANG.
language = "en"

# Where the database lives. Default: next to this file. brain.log and attachments/ sit beside it.
# db_path = "D:/brain/brain.db"

# --- Sources ------------------------------------------------------------------

[obsidian]
enabled = true
# `brain init` finds your vaults (from the list Obsidian keeps). Or set them by hand:
vaults = ["C:/Users/YOU/Documents/Obsidian/Notes"]
# Folder names to skip, at any depth
exclude = [".obsidian", ".trash", ".git", "templates", "_templates"]
# Screenshots and attachments: searchable by the text around where they are embedded,
# PDFs also by their content.
attachments = true
attachment_ext = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".svg", ".heic", ".pdf"]
# Copy the files into attachments/ next to the database, so they survive deletion from Obsidian
copy_attachments = true
max_attachment_mb = 25

[claude_code]
enabled = true
# Found automatically: ~/.claude/projects (or CLAUDE_CONFIG_DIR if set).
# Only set it if your sessions live elsewhere:
# dir = "D:/somewhere/.claude/projects"
# How much of each tool result (file reads, command output) to keep.
max_tool_chars = 1500

[codex]
enabled = true
# Found automatically: ~/.codex/sessions and archived_sessions (or CODEX_HOME if set).
# dirs = ["D:/somewhere/.codex/sessions"]
max_tool_chars = 1500

[github]
enabled = true
# The token comes from this environment variable, or from `gh auth token`.
token_env = "GITHUB_TOKEN"
# Empty = all your repositories. Patterns work: ["me/*", "me/project-*"]
repos = []
include_forks = false
# How far back the first sync goes
since = "2025-01-01"
# Safety limit for pagination on huge repositories
max_pages = 30

# --- Export --------------------------------------------------------------------

[export]
# Copy the database (and attachments) here after every sync that changed something.
# Uses the SQLite backup API — safe even while a sync is writing.
after_sync = []            # e.g. ["D:/Dropbox/agent-recall/brain.db"]
# Daily snapshots brain-YYYY-MM-DD.db in this folder (empty = off)
daily_snapshots_dir = ""   # e.g. "D:/Backup/agent-recall"
keep_daily = 14

# --- Projects ------------------------------------------------------------------
# Items are linked to projects by rules. Patterns are shell-style (*, ?).
#   cwd      — working directory of a Claude Code / Codex session
#   repo     — owner/name on GitHub
#   obsidian — note path inside the vault
#   tags     — Obsidian tags (without #)
#   jira     — Jira project keys: ["SHOP"] finds SHOP-123 in any text
#   keywords — substrings (case-insensitive)
#   regex    — regular expressions over the text
# After editing rules: brain projects --rebuild

# [[projects]]
# id = "shop"
# name = "Online shop"
# cwd = ["*shop-frontend*", "*shop-api*"]
# repo = ["me/shop-*"]
# obsidian = ["Work/Shop/*"]
# tags = ["shop"]
# jira = ["SHOP"]
# keywords = ["checkout-service"]

