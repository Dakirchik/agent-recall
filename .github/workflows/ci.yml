name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[mcp]" pytest
      - name: Tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          brain --help
          brain paths

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse brainctl.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\brainctl.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host "brainctl.ps1 parses cleanly"
      - name: brainctl help
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\brainctl.ps1 help
